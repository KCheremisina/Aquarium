<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐠 Аквариум с рыбками</title>

 <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #0a2e2f 0%, #1c4b5c 50%, #2b3b8c 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }

    #header {
        text-align: center;
        margin-bottom: 15px;
    }

    #header h1 {
        color: #a0e7ff;
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 3px;
        text-shadow: 0 0 20px rgba(160, 231, 255, 0.6);
    }

    #header p {
        color: #88c8dc;
        font-size: 0.9rem;
        margin-top: 5px;
    }

    #aquarium-container {
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
            0 0 40px rgba(75, 130, 200, 0.25),
            0 20px 60px rgba(0, 0, 0, 0.5),
            inset 0 0 80px rgba(0, 0, 0, 0.4);
        border: 2px solid rgba(75, 130, 200, 0.4);
    }

    #controls {
        margin-top: 15px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .btn {
        padding: 10px 22px;
        border: 1px solid rgba(100, 150, 230, 0.5);
        background: rgba(30, 60, 100, 0.3);
        color: #bfe4ff;
        border-radius: 25px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }

    .btn:hover {
        background: rgba(70, 120, 200, 0.4);
        box-shadow: 0 0 20px rgba(70, 120, 200, 0.5);
        transform: translateY(-2px);
        color: #ffffff;
        border-color: rgba(100, 150, 255, 0.8);
    }

    #stats {
        color: #88b0d0;
        font-size: 0.85rem;
        margin-top: 10px;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }
</style>

</head>

<body>
    <div id="header">
        <h1>🐠 АКВАРИУМ</h1>
        <p>Кликните по аквариуму, чтобы добавить корм</p>
    </div>
    <div id="aquarium-container"></div>
    <div id="controls">
        <button class="btn" id="btnFeed">* Бросить корм</button>
        <button class="btn" id="btnAddFish">➕ Добавить рыбку</button>
        <button class="btn" id="btnBubble">о Пузырьки</button>
        <button class="btn" id="btnClear">🗑 Очистить корм</button>
    </div>
    <div id="stats">Рыбок: <span id="fishCount">0</span> | Корма: <span id="foodCount">0</span></div>
    <script src="https://pixijs.download/v7.3.2/pixi.min.js"></script>
    <script>
        (() => {
            const W = Math.min(900, window.innerWidth - 30);
            const H = Math.min(550, window.innerHeight - 220);
            const app = new PIXI.Application({ width: W, height: H, backgroundColor: 0x0c2340, antialias: true });
            document.getElementById('aquarium-container').appendChild(app.view);

            const fishLayer = new PIXI.Container();
            const foodLayer = new PIXI.Container();
            const bubbleLayer = new PIXI.Container();
            const plantLayer = new PIXI.Container();
            const lightLayer = new PIXI.Container();
            app.stage.addChild(lightLayer, plantLayer, bubbleLayer, foodLayer, fishLayer);

            const bgGfx = new PIXI.Graphics();
            bgGfx.beginFill(0x0c2340).drawRect(0, 0, W, H).endFill();
            app.stage.addChildAt(bgGfx, 0);
            const sandGfx = new PIXI.Graphics();
            sandGfx.beginFill(0x8B7355, 0.6).moveTo(0, H - 50);
            for (let i = 0;
                i <= W;
                i += 30) sandGfx.lineTo(i, H - 50 + Math.sin(i * 0.05) * 8);
            sandGfx.lineTo(W, H).lineTo(0, H).closePath().endFill();
            app.stage.addChildAt(sandGfx, 1);
            const pebbleColors = [0x6B5B45, 0x9B8B75, 0x7B6B55, 0xAB9B85, 0x5B4B35];
            for (let i = 0;
                i < 40;
                i++) {
                const pgfx = new PIXI.Graphics();
                const sz = 3 + Math.random() * 6;
                pgfx.beginFill(pebbleColors[Math.floor(Math.random() * pebbleColors.length)], 0.7)
                    .drawEllipse(Math.random() * W, H - 30 + Math.random() * 20, sz, sz * 0.6).endFill();
                app.stage.addChildAt(pgfx, 2);
            }

            // Функция создания водоросли с изменяемой высотой
            function createSeaweed(x, baseHeight) {
                const plant = new PIXI.Container();
                // случайное отклонение 
                const variation = 0.20;
                const h = baseHeight * (1 + (Math.random() - 0.5) * variation * 2);
                const segments = Math.max(4, Math.floor(h / 20)); // минимум 4 сегмента для коротких

                let prevX = x, prevY = H - 20;
                for (let i = 0; i < segments; i++) {
                    const sway = Math.sin(i * 0.5) * 10 + Math.random() * 8;
                    const newX = x + sway;
                    const newY = H - 20 - (i + 1) * (h / segments);
                    const segGfx = new PIXI.Graphics();
                    segGfx.lineStyle(4 + (1 - i / segments) * 4, 0x2D8B46, 0.7);
                    segGfx.moveTo(prevX, prevY);
                    segGfx.lineTo(newX, newY);
                    plant.addChild(segGfx);
                    if (i === segments - 1) {
                        const leaf = new PIXI.Graphics();
                        leaf.beginFill(0x3DA65A, 0.8);
                        leaf.drawEllipse(newX, newY, 12, 5);
                        leaf.endFill();
                        plant.addChild(leaf);
                    }
                    prevX = newX;
                    prevY = newY;
                }
                plant.baseRotation = ((Math.random() - 0.5) * 15) * Math.PI / 180;
                plant.rotation = plant.baseRotation;
                plant.swayOffset = Math.random() * Math.PI * 2;
                plant.swaySpeed = 0.5 + Math.random() * 0.5;
                return plant;
            }

            // Создание растений
            const plants = [];
            const basePlantHeight = 240; // теперь 240 +- 10% 
            for (let i = 0; i < 7; i++) {
                const x = 30 + (i / 6) * (W - 60);
                const plant = createSeaweed(x, basePlantHeight);
                plantLayer.addChild(plant);
                plants.push(plant);
            }

            const lightRays = [];
            for (let i = 0;
                i < 5;
                i++) {
                const rayGfx = new PIXI.Graphics();
                const rx = 50 + i * (W / 5);
                rayGfx.beginFill(0x7fdbff, 0.02).moveTo(rx - 30, 0).lineTo(rx + 30, 0).lineTo(rx + 80, H).lineTo(rx - 80, H).closePath().endFill();
                rayGfx.alpha = 0;
                lightLayer.addChild(rayGfx);
                lightRays.push({ gfx: rayGfx, speed: 0.3 + Math.random() * 0.5, offset: Math.random() * Math.PI * 2 });
            }

            const fishes = [], foods = [], bubbles = [];
            const fishColors = [
                { body: 0xFF6B35, fin: 0xFF9F1C, accent: 0xFFD700 }, { body: 0x3A86FF, fin: 0x8338EC, accent: 0x00F5FF },
                { body: 0xFF006E, fin: 0xFF4D9E, accent: 0xFFB3C6 }, { body: 0x06D6A0, fin: 0x0BF0B5, accent: 0x8AEECA },
                { body: 0xFFBE0B, fin: 0xFFD60A, accent: 0xFFF3B0 }, { body: 0xE63946, fin: 0xFF6B6B, accent: 0xFFAAAA },
                { body: 0x8338EC, fin: 0xA855F7, accent: 0xC084FC }, { body: 0x00B4D8, fin: 0x48CAE4, accent: 0x90E0EF }];
            function updateStats() {
                document.getElementById('fishCount').textContent = fishes.length;
                document.getElementById('foodCount').textContent = foods.filter(f => !f.eaten).length;
            }
            function createFood(x, y) {
                const food = new PIXI.Container();
                const gfx = new PIXI.Graphics();
                const t = Math.random();
                if (t < 0.33) gfx.beginFill(0xC68E17, 0.9).drawEllipse(0, 0, 5, 3);
                else if (t < 0.66) gfx.beginFill(0xA0522D, 0.9).drawCircle(0, 0, 4);
                else gfx.beginFill(0xFF6347, 0.8).drawEllipse(0, 0, 7, 2.5);
                gfx.endFill();
                food.addChild(gfx);
                food.x = x;
                food.y = y;
                food.sinkSpeed = 1 + Math.random() * 10;
                food.vx = (Math.random() - 0.5) * 6;
                food.eaten = false;
                food.alpha = 1;
                foodLayer.addChild(food);
                foods.push(food);
                updateStats();
                return food;
            }
            function createFish(x, y) {
                if (fishes.length >= 20) {
                    console.log("Лимит рыбок 20 штук, больше вам не надо");
                    return null;
                }
                const fish = new PIXI.Container();
                const color = fishColors[Math.floor(Math.random() * fishColors.length)];
                const size = 20 + Math.random() * 25;
                const bodyGfx = new PIXI.Graphics();
                bodyGfx.beginFill(color.body).drawEllipse(0, 0, size, size * 0.5).endFill();
                fish.addChild(bodyGfx);
                const stripeGfx = new PIXI.Graphics();
                stripeGfx.lineStyle(2, color.accent, 0.5);
                for (let i = -1;
                    i <= 1;
                    i++) stripeGfx.moveTo(i * size * 0.3, -size * 0.45).lineTo(i * size * 0.3, size * 0.45);
                fish.addChild(stripeGfx);
                const tailGfx = new PIXI.Graphics();
                tailGfx.beginFill(color.fin).moveTo(-size * 0.7, 0).lineTo(-size * 1.2, -size * 0.45).lineTo(-size * 1.2, size * 0.45).closePath().endFill();
                fish.addChild(tailGfx);
                fish.tail = tailGfx;
                const dorsalGfx = new PIXI.Graphics();
                dorsalGfx.beginFill(color.fin, 0.7).moveTo(-size * 0.2, -size * 0.45).lineTo(size * 0.1, -size * 0.85).lineTo(size * 0.3, -size * 0.45).closePath().endFill();
                fish.addChild(dorsalGfx);
                fish.dorsal = dorsalGfx;
                const eyeGfx = new PIXI.Graphics();
                eyeGfx.beginFill(0xFFFFFF).drawCircle(size * 0.5, -size * 0.08, size * 0.18).endFill();
                eyeGfx.beginFill(0x111111).drawCircle(size * 0.55, -size * 0.08, size * 0.1).endFill();
                fish.addChild(eyeGfx);
                const mouthGfx = new PIXI.Graphics();
                mouthGfx.lineStyle(1.5, color.accent, 0.8).arc(size * 0.9, size * 0.1, size * 0.12, 0, Math.PI, false);
                fish.addChild(mouthGfx);
                fish.mouth = mouthGfx;
                fish.x = x !== undefined ? x : 50 + Math.random() * (W - 100);
                fish.y = y !== undefined ? y : 50 + Math.random() * (H - 150);
                fish.vx = (Math.random() - 0.5) * 40;
                fish.vy = (Math.random() - 0.5) * 30;
                fish.size = size;
                fish.baseSpeed = 1 + Math.random() * 1;
                // спокойно плывут
                fish.state = 'wander';
                fish.targetFood = null;
                fish.hungerTimer = 0;
                fish.animOffset = Math.random() * Math.PI * 2;
                fish.direction = fish.vx >= 0 ? 1 : -1;
                fishLayer.addChild(fish);
                fishes.push(fish);
                updateStats();
                return fish;
            }
            function createBubble(x, y) {
                const bubble = new PIXI.Container();
                const gfx = new PIXI.Graphics();
                const sz = 2 + Math.random() * 6;
                gfx.lineStyle(1, 0x7fdbff, 0.4).beginFill(0x7fdbff, 0.08).drawCircle(0, 0, sz).endFill();
                bubble.addChild(gfx);
                bubble.x = x !== undefined ? x : 20 + Math.random() * (W - 40);
                bubble.y = y !== undefined ? y : H + 10;
                bubble.vy = -15 - Math.random() * 25;
                bubble.vx = (Math.random() - 0.5) * 4;
                bubble.size = sz;
                bubble.wobble = Math.random() * Math.PI * 2;
                bubbleLayer.addChild(bubble);
                bubbles.push(bubble);
            }
            for (let i = 0;
                i < 6;
                i++) createFish();
            app.ticker.add(() => {
                if (Math.random() < 0.03) createBubble();
            });
            app.view.addEventListener('click', (e) => {
                const rect = app.view.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (W / rect.width);
                const y = (e.clientY - rect.top) * (H / rect.height);
                createFood(x, y);
                createFood(x + (Math.random() - 0.5) * 30, y - 10);
                createFood(x + (Math.random() - 0.5) * 30, y - 5);
            });
            document.getElementById('btnFeed').addEventListener('click', () => {
                const bx = 100 + Math.random() * (W - 200);
                for (let i = 0;
                    i < 8;
                    i++) createFood(bx + (Math.random() - 0.5) * 80, -10 - Math.random() * 30);
            });
            document.getElementById('btnAddFish').addEventListener('click', () => {
                if (fishes.length < 20) {
                    createFish();
                } else {
                    alert("В аквариуме уже 20 рыбок! Нельзя добавить больше.");
                }
            });
            document.getElementById('btnBubble').addEventListener('click', () => {
                for (let i = 0;
                    i < 20;
                    i++) createBubble(100 + Math.random() * (W - 200), H + Math.random() * 50);
            });
            document.getElementById('btnClear').addEventListener('click', () => {
                while (foods.length) {
                    const f = foods.pop();
                    foodLayer.removeChild(f);
                    f.destroy();
                } updateStats();
            });

            let time = 0;
            app.ticker.add((delta) => {
                time += delta * 0.016;
                for (const ray of lightRays) ray.gfx.alpha = 0.3 + 0.3 * Math.sin(time * ray.speed + ray.offset);
                for (const plant of plants) {
                    const sway = Math.sin(time * plant.swaySpeed + plant.swayOffset) * 3;
                    plant.rotation = plant.baseRotation + (sway * Math.PI) / 180;
                }

                for (const fish of fishes) {
                    fish.hungerTimer += delta * 0.016;
                    let nearestFood = null, nearestDist = Infinity;
                    for (const f of foods) if (!f.eaten) {
                        const dx = f.x - fish.x, dy = f.y - fish.y, dist = Math.hypot(dx, dy);
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            nearestFood = f;
                        }
                    }
                    if (nearestFood && nearestDist < 250) {
                        fish.state = 'chase';
                        fish.targetFood = nearestFood;
                    } else {
                        fish.state = 'wander';
                        fish.targetFood = null;
                    }

                    let targetVx, targetVy;
                    const speed = fish.baseSpeed;
                    if (fish.state === 'chase' && fish.targetFood && !fish.targetFood.eaten) {
                        const fdx = fish.targetFood.x - fish.x, fdy = fish.targetFood.y - fish.y, fdist = Math.hypot(fdx, fdy);
                        if (fdist < fish.size * 0.8) {
                            fish.targetFood.eaten = true;
                            fish.hungerTimer = 0;
                            updateStats();
                            fish.mouth.visible = false;
                            setTimeout(() => {
                                if (fish.mouth) fish.mouth.visible = true;
                            }, 500);
                            targetVx = fish.vx;
                            targetVy = fish.vy;
                        } else {
                            targetVx = (fdx / fdist) * speed * 3.0;
                            // возможно уже с ускорением
                            targetVy = (fdy / fdist) * speed * 2.0;
                        }
                    } else {
                        if (Math.random() < 0.02) {
                            fish.vx += (Math.random() - 0.5) * 3;
                            fish.vy += (Math.random() - 0.5) * 2;
                        } // медленные повороты
                        const margin = 60;
                        if (fish.x < margin) fish.vx += 2;
                        if (fish.x > W - margin) fish.vx -= 2;
                        if (fish.y < margin) fish.vy += 2;
                        if (fish.y > H - margin - 40) fish.vy -= 2;
                        let cs = Math.hypot(fish.vx, fish.vy);
                        if (cs > speed) {
                            fish.vx = (fish.vx / cs) * speed;
                            fish.vy = (fish.vy / cs) * speed;
                        }
                        targetVx = fish.vx;
                        targetVy = fish.vy;
                    }
                    fish.x += targetVx * delta;
                    fish.y += targetVy * delta;
                    fish.x = Math.min(Math.max(fish.x, 15), W - 15);
                    fish.y = Math.min(Math.max(fish.y, 30), H - 55);
                    if (targetVx > 0.2) fish.direction = 1;
                    if (targetVx < -0.2) fish.direction = -1;
                    fish.scale.x = fish.direction;
                    const tailWag = Math.sin(time * 6 + fish.animOffset) * 0.3;
                    fish.tail.rotation = tailWag;
                    fish.dorsal.rotation = Math.sin(time * 4 + fish.animOffset) * 0.15;
                }
                for (let i = foods.length - 1;
                    i >= 0;
                    i--) {
                    const f = foods[i];
                    if (f.eaten) {
                        f.alpha -= 0.1;
                        f.scale.x += 0.1;
                        f.scale.y += 0.1;
                        if (f.alpha <= 0) {
                            foodLayer.removeChild(f);
                            f.destroy();
                            foods.splice(i, 1);
                            updateStats();
                        }
                    }
                    else {
                        f.y += f.sinkSpeed * delta;
                        f.x += f.vx * delta;
                        f.rotation += 0.02 * delta;
                        if (f.y > H - 20) {
                            foodLayer.removeChild(f);
                            f.destroy();
                            foods.splice(i, 1);
                            updateStats();
                        }
                    }
                }
                for (let i = bubbles.length - 1;
                    i >= 0;
                    i--) {
                    const b = bubbles[i];
                    b.y += b.vy * delta;
                    b.x += b.vx * delta + Math.sin(time * 2 + b.wobble) * 0.3;
                    if (b.y < -20 || b.x < -50 || b.x > W + 50) {
                        bubbleLayer.removeChild(b);
                        b.destroy();
                        bubbles.splice(i, 1);
                    }
                }
            });
        })();
    </script>
</body>

</html>
