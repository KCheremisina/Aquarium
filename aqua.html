<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐠 Аквариум с рыбками - PRO версия</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a2e2f 0%, #1c4b5c 50%, #2b3b8c 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        #header {
            text-align: center;
            margin-bottom: 15px;
        }

        #header h1 {
            color: #a0e7ff;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(160, 231, 255, 0.6);
        }

        #header p {
            color: #88c8dc;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        #aquarium-container {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(75, 130, 200, 0.25), 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 80px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(75, 130, 200, 0.4);
            cursor: pointer;
        }

        .controls-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 22px;
            border: 1px solid rgba(100, 150, 230, 0.5);
            background: rgba(30, 60, 100, 0.3);
            color: #bfe4ff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 500;
        }

        .btn:hover {
            background: rgba(70, 120, 200, 0.4);
            box-shadow: 0 0 20px rgba(70, 120, 200, 0.5);
            transform: translateY(-2px);
            color: #ffffff;
            border-color: rgba(100, 150, 255, 0.8);
        }

        .btn-primary {
            background: rgba(70, 120, 200, 0.5);
            border-color: rgba(100, 150, 255, 0.8);
        }

        .stats-panel {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 15px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 0.9rem;
        }

        .stat {
            color: #88b0d0;
        }

        .stat span {
            color: #ffd966;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .auto-feed {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: rgba(30, 60, 100, 0.3);
            border-radius: 25px;
            backdrop-filter: blur(5px);
        }

        .auto-feed label {
            color: #bfe4ff;
            cursor: pointer;
        }

        .auto-feed input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        @keyframes notification {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffd966;
            padding: 10px 20px;
            border-radius: 10px;
            border-left: 4px solid #ffd966;
            font-size: 0.9rem;
            animation: notification 2s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }

        .instruction {
            color: #88c8dc;
            font-size: 0.8rem;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="header">
        <h1>🐠 АКВАРИУМ PRO</h1>
        <p>Кликните по аквариуму, чтобы добавить корм | Рыбки плавают стайками (строго до 5 в стае)!</p>
    </div>
    <div id="aquarium-container"></div>

    <div class="controls-panel">
        <button class="btn" id="btnFeed">🍕 Бросить корм</button>
        <button class="btn" id="btnAddFish">🐟 Добавить рыбку</button>
        <button class="btn" id="btnBubble">💨 Пузырьки</button>
        <button class="btn" id="btnClear">🗑 Очистить корм</button>
        <button class="btn btn-primary" id="btnNightMode">🌙 Ночной режим</button>
        <div class="auto-feed">
            <input type="checkbox" id="autoFeedToggle">
            <label for="autoFeedToggle">🤖 Автокорм (каждые 15 сек)</label>
        </div>
    </div>

    <div class="stats-panel">
        <div class="stat">🐠 Рыбок: <span id="fishCount">0</span></div>
        <div class="stat">🍕 Корма: <span id="foodCount">0</span></div>
        <div class="stat">🍽️ Съедено: <span id="eatenCount">0</span></div>
        <div class="stat">🏆 Достижения: <span id="achievementCount">0</span></div>
    </div>

    <div class="instruction">
        💡 Левая кнопка: испугать рыбок (рывок) | Правая кнопка: бросить корм
    </div>

    <script src="https://pixijs.download/v7.3.2/pixi.min.js"></script>
    <script>
        (() => {
            const W = Math.min(900, window.innerWidth - 30);
            const H = Math.min(550, window.innerHeight - 300); 
            const app = new PIXI.Application({
                width: 400,
                height: 300,
                backgroundColor: 0x000000,
                backgroundAlpha: 0, 
                transparent: true,  
                antialias: true
            });
            document.getElementById('aquarium-container').appendChild(app.view);

            // Слои
            const fishLayer = new PIXI.Container();
            const foodLayer = new PIXI.Container();
            const bubbleLayer = new PIXI.Container();
            const plantLayer = new PIXI.Container();
            const lightLayer = new PIXI.Container();
            const effectLayer = new PIXI.Container();
            app.stage.addChild(lightLayer, plantLayer, bubbleLayer, foodLayer, effectLayer, fishLayer);

            // Фон и декорации
            const bgGfx = new PIXI.Graphics();
            bgGfx.beginFill(0x0c2340).drawRect(0, 0, W, H).endFill();
            app.stage.addChildAt(bgGfx, 0);

            const sandGfx = new PIXI.Graphics();
            sandGfx.beginFill(0x8B7355, 0.6).moveTo(0, H - 50);
            for (let i = 0; i <= W; i += 30) sandGfx.lineTo(i, H - 50 + Math.sin(i * 0.05) * 8);
            sandGfx.lineTo(W, H).lineTo(0, H).closePath().endFill();
            app.stage.addChildAt(sandGfx, 1);

            const pebbleColors = [0x6B5B45, 0x9B8B75, 0x7B6B55, 0xAB9B85, 0x5B4B35];
            for (let i = 0; i < 40; i++) {
                const pgfx = new PIXI.Graphics();
                const sz = 3 + Math.random() * 6;
                pgfx.beginFill(pebbleColors[Math.floor(Math.random() * pebbleColors.length)], 0.7)
                    .drawEllipse(Math.random() * W, H - 30 + Math.random() * 20, sz, sz * 0.6).endFill();
                app.stage.addChildAt(pgfx, 2);
            }

            // Растения
            function createSeaweed(x, baseHeight) {
                const plant = new PIXI.Container();
                const variation = 0.20;
                const h = baseHeight * (1 + (Math.random() - 0.5) * variation * 2);
                const segments = Math.max(4, Math.floor(h / 20));
                let prevX = x, prevY = H - 20;
                for (let i = 0; i < segments; i++) {
                    const sway = Math.sin(i * 0.5) * 10 + Math.random() * 8;
                    const newX = x + sway;
                    const newY = H - 20 - (i + 1) * (h / segments);
                    const segGfx = new PIXI.Graphics();
                    segGfx.lineStyle(4 + (1 - i / segments) * 4, 0x2D8B46, 0.7);
                    segGfx.moveTo(prevX, prevY);
                    segGfx.lineTo(newX, newY);
                    plant.addChild(segGfx);
                    if (i === segments - 1) {
                        const leaf = new PIXI.Graphics();
                        leaf.beginFill(0x3DA65A, 0.8);
                        leaf.drawEllipse(newX, newY, 12, 5);
                        leaf.endFill();
                        plant.addChild(leaf);
                    }
                    prevX = newX;
                    prevY = newY;
                }
                plant.baseRotation = ((Math.random() - 0.5) * 15) * Math.PI / 180;
                plant.rotation = plant.baseRotation;
                plant.swayOffset = Math.random() * Math.PI * 2;
                plant.swaySpeed = 0.5 + Math.random() * 0.5;
                return plant;
            }

            const plants = [];
            const basePlantHeight = 240;
            for (let i = 0; i < 7; i++) {
                const x = 30 + (i / 6) * (W - 60);
                const plant = createSeaweed(x, basePlantHeight);
                plantLayer.addChild(plant);
                plants.push(plant);
            }

            // Световые лучи
            const lightRays = [];
            for (let i = 0; i < 5; i++) {
                const rayGfx = new PIXI.Graphics();
                const rx = 50 + i * (W / 5);
                rayGfx.beginFill(0x7fdbff, 0.02).moveTo(rx - 30, 0).lineTo(rx + 30, 0).lineTo(rx + 80, H).lineTo(rx - 80, H).closePath().endFill();
                rayGfx.alpha = 0;
                lightLayer.addChild(rayGfx);
                lightRays.push({ gfx: rayGfx, speed: 0.3 + Math.random() * 0.5, offset: Math.random() * Math.PI * 2 });
            }

            // Статистика и достижения
            let totalEaten = 0;
            let achievements = [];

            function loadStats() {
                const saved = localStorage.getItem('aquariumStats');
                if (saved) {
                    const stats = JSON.parse(saved);
                    totalEaten = stats.totalEaten || 0;
                    achievements = stats.achievements || [];
                    updateAchievementsDisplay();
                }
                updateStats();
            }

            function saveStats() {
                localStorage.setItem('aquariumStats', JSON.stringify({
                    totalEaten: totalEaten,
                    achievements: achievements
                }));
            }

            function checkAchievements() {
                let newAchievements = [];
                if (fishes.length >= 10 && !achievements.includes('school_master')) {
                    newAchievements.push('school_master');
                    showNotification('🏆 Достижение: Повелитель стаи! (10 рыбок)');
                }
                if (totalEaten >= 50 && !achievements.includes('generous')) {
                    newAchievements.push('generous');
                    showNotification('🏆 Достижение: Щедрая душа! (50 корма съедено)');
                }
                if (totalEaten >= 100 && !achievements.includes('feast')) {
                    newAchievements.push('feast');
                    showNotification('🏆 Достижение: Королевский пир! (100 корма съедено)');
                }
                if (fishes.length >= 20 && !achievements.includes('aquarium_master')) {
                    newAchievements.push('aquarium_master');
                    showNotification('🏆 Достижение: Аквариумный магнат! (20 рыбок)');
                }
                if (newAchievements.length > 0) {
                    achievements.push(...newAchievements);
                    saveStats();
                    updateAchievementsDisplay();
                }
            }

            function updateAchievementsDisplay() {
                document.getElementById('achievementCount').textContent = achievements.length;
            }

            function showNotification(msg) {
                const notif = document.createElement('div');
                notif.className = 'notification';
                notif.textContent = msg;
                document.body.appendChild(notif);
                setTimeout(() => notif.remove(), 2000);
            }

            const fishes = [], foods = [], bubbles = [];
            const fishColors = [
                { body: 0xFF6B35, fin: 0xFF9F1C, accent: 0xFFD700 }, { body: 0x3A86FF, fin: 0x8338EC, accent: 0x00F5FF },
                { body: 0xFF006E, fin: 0xFF4D9E, accent: 0xFFB3C6 }, { body: 0x06D6A0, fin: 0x0BF0B5, accent: 0x8AEECA },
                { body: 0xFFBE0B, fin: 0xFFD60A, accent: 0xFFF3B0 }, { body: 0xE63946, fin: 0xFF6B6B, accent: 0xFFAAAA },
                { body: 0x8338EC, fin: 0xA855F7, accent: 0xC084FC }, { body: 0x00B4D8, fin: 0x48CAE4, accent: 0x90E0EF }
            ];

            function updateStats() {
                document.getElementById('fishCount').textContent = fishes.length;
                document.getElementById('foodCount').textContent = foods.filter(f => !f.eaten).length;
                document.getElementById('eatenCount').textContent = totalEaten;
            }

            function createFood(x, y) {
                const food = new PIXI.Container();
                const gfx = new PIXI.Graphics();
                const t = Math.random();
                if (t < 0.33) gfx.beginFill(0xC68E17, 0.9).drawEllipse(0, 0, 5, 3);
                else if (t < 0.66) gfx.beginFill(0xA0522D, 0.9).drawCircle(0, 0, 4);
                else gfx.beginFill(0xFF6347, 0.8).drawEllipse(0, 0, 7, 2.5);
                gfx.endFill();
                food.addChild(gfx);
                food.x = x;
                food.y = y;
                food.sinkSpeed = 1 + Math.random() * 10;
                food.vx = (Math.random() - 0.5) * 6;
                food.eaten = false;
                food.alpha = 1;
                foodLayer.addChild(food);
                foods.push(food);
                updateStats();
                return food;
            }

            // Функция для испуга рыбок с рывком
            function scareFish(x, y) {
                let scaredCount = 0;
                for (const fish of fishes) {
                    const dx = fish.x - x;
                    const dy = fish.y - y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 100) {
                        if (fish.scareTimeout) {
                            clearTimeout(fish.scareTimeout);
                            if (fish.savedBaseSpeed) {
                                fish.baseSpeed = fish.savedBaseSpeed;
                            }
                            fish.scareTimeout = null;
                        }

                        fish.savedBaseSpeed = fish.baseSpeed;
                        fish.savedVx = fish.vx;
                        fish.savedVy = fish.vy;

                        const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * Math.PI / 3;
                        const force = 25 * (1 - dist / 100);

                        fish.vx = Math.cos(angle) * force * 5;
                        fish.vy = Math.sin(angle) * force * 5;
                        fish.baseSpeed = fish.savedBaseSpeed * 5;

                        fish.scareTimeout = setTimeout(() => {
                            if (fish.savedBaseSpeed) {
                                fish.baseSpeed = fish.savedBaseSpeed;
                                fish.vx = fish.savedVx || 0;
                                fish.vy = fish.savedVy || 0;
                                delete fish.savedBaseSpeed;
                                delete fish.savedVx;
                                delete fish.savedVy;
                                delete fish.scareTimeout;
                            }
                        }, 1000);

                        scaredCount++;

                        const exclamation = new PIXI.Text('!!', {
                            fontFamily: 'Arial',
                            fontSize: 24,
                            fill: 0xff0000,
                            fontWeight: 'bold'
                        });
                        exclamation.x = fish.x;
                        exclamation.y = fish.y - 25;
                        exclamation.alpha = 1;
                        effectLayer.addChild(exclamation);

                        let alpha = 1;
                        const interval = setInterval(() => {
                            alpha -= 0.1;
                            exclamation.alpha = alpha;
                            if (alpha <= 0) {
                                effectLayer.removeChild(exclamation);
                                exclamation.destroy();
                                clearInterval(interval);
                            }
                        }, 50);

                        fish.direction = fish.vx >= 0 ? 1 : -1;
                        fish.scale.x = fish.direction;
                    }
                }

                if (scaredCount > 0) {
                    showNotification(`😱 Рывок! Испугано ${scaredCount} рыбок!`);

                    const shockwave = new PIXI.Graphics();
                    shockwave.lineStyle(3, 0xff6666, 0.8);
                    shockwave.drawCircle(0, 0, 10);
                    shockwave.x = x;
                    shockwave.y = y;
                    effectLayer.addChild(shockwave);

                    let radius = 10;
                    const waveInterval = setInterval(() => {
                        radius += 8;
                        shockwave.clear();
                        shockwave.lineStyle(3, 0xff6666, 0.8 - radius / 100);
                        shockwave.drawCircle(0, 0, radius);
                        if (radius > 120) {
                            effectLayer.removeChild(shockwave);
                            shockwave.destroy();
                            clearInterval(waveInterval);
                        }
                    }, 30);
                }
            }

            // Функция для плавного уплывания рыбки от стаи (без ускорения)
            function forceFishToLeave(fish, centerX, centerY) {
                if (fish.leaveTimeout) return; // Уже уплывает

                // Сохраняем нормальную базовую скорость (не меняем её)
                fish.normalBaseSpeed = fish.baseSpeed;

                // Случайное направление от центра стаи
                const angle = Math.atan2(fish.y - centerY, fish.x - centerX) + (Math.random() - 0.5) * Math.PI;
                const newVx = Math.cos(angle) * 2; // Медленная скорость без ускорения
                const newVy = Math.sin(angle) * 2;

                // Плавно меняем направление, сохраняя текущую скорость
                fish.vx = newVx;
                fish.vy = newVy;

                // Отключаем притяжение к стае на время
                fish.isLeaving = true;

                // Устанавливаем таймер на возврат через 1.5 секунды (даем время отплыть)
                fish.leaveTimeout = setTimeout(() => {
                    fish.isLeaving = false;
                    delete fish.normalBaseSpeed;
                    delete fish.leaveTimeout;
                }, 1500);

                // Визуальный эффект "уплываю"
                const leaveEffect = new PIXI.Text('🚶‍♂️', {
                    fontFamily: 'Arial',
                    fontSize: 18,
                    fill: 0xffaa44,
                    fontWeight: 'bold'
                });
                leaveEffect.x = fish.x;
                leaveEffect.y = fish.y - 20;
                leaveEffect.alpha = 1;
                effectLayer.addChild(leaveEffect);

                setTimeout(() => {
                    if (leaveEffect.parent) {
                        effectLayer.removeChild(leaveEffect);
                        leaveEffect.destroy();
                    }
                }, 600);
            }

            // Таймеры для отсрочки разгона стай
            let scatterTimeout = null;
            let pendingScatter = false;

            // Управление переполненными стаями с задержкой
            function scheduleScatter() {
                if (scatterTimeout) {
                    clearTimeout(scatterTimeout);
                }

                pendingScatter = true;
                scatterTimeout = setTimeout(() => {
                    if (pendingScatter) {
                        performScatter();
                        pendingScatter = false;
                    }
                    scatterTimeout = null;
                }, 3000); // Ждем 3 секунды перед разгоном стаи
            }

            function performScatter() {
                // Группируем всех рыбок в кластеры
                const processed = new Set();
                const clusters = [];

                for (const fish of fishes) {
                    if (processed.has(fish)) continue;

                    const cluster = [fish];
                    const queue = [fish];
                    processed.add(fish);

                    while (queue.length > 0) {
                        const current = queue.shift();
                        for (const other of fishes) {
                            if (!processed.has(other)) {
                                const dist = Math.hypot(other.x - current.x, other.y - current.y);
                                if (dist < 150) {
                                    cluster.push(other);
                                    processed.add(other);
                                    queue.push(other);
                                }
                            }
                        }
                    }

                    if (cluster.length > 0) {
                        clusters.push(cluster);
                    }
                }

                // Обрабатываем каждый кластер
                let scattered = false;
                for (const cluster of clusters) {
                    if (cluster.length > 5) {
                        // Находим центр кластера
                        const centerX = cluster.reduce((sum, f) => sum + f.x, 0) / cluster.length;
                        const centerY = cluster.reduce((sum, f) => sum + f.y, 0) / cluster.length;

                        // Сортируем по расстоянию от центра
                        cluster.sort((a, b) => {
                            const distA = Math.hypot(a.x - centerX, a.y - centerY);
                            const distB = Math.hypot(b.x - centerX, b.y - centerY);
                            return distA - distB;
                        });

                        // Оставляем 5 ближайших к центру
                        const toLeave = cluster.slice(5);

                        // Заставляем лишних рыбок уплыть
                        for (const lonelyFish of toLeave) {
                            if (!lonelyFish.isLeaving) {
                                forceFishToLeave(lonelyFish, centerX, centerY);
                                scattered = true;
                            }
                        }
                    }
                }

                if (scattered) {
                    showNotification("🐟 Стая переполнена! Лишние рыбки отплывают...");
                }
            }

            function createFish(x, y) {
                if (fishes.length >= 25) {
                    showNotification("В аквариуме уже 25 рыбок! Нельзя добавить больше.");
                    return null;
                }
                const fish = new PIXI.Container();
                const color = fishColors[Math.floor(Math.random() * fishColors.length)];
                const size = 20 + Math.random() * 25;
                const bodyGfx = new PIXI.Graphics();
                bodyGfx.beginFill(color.body).drawEllipse(0, 0, size, size * 0.5).endFill();
                fish.addChild(bodyGfx);

                const stripeGfx = new PIXI.Graphics();
                stripeGfx.lineStyle(2, color.accent, 0.5);
                for (let i = -1; i <= 1; i++) stripeGfx.moveTo(i * size * 0.3, -size * 0.45).lineTo(i * size * 0.3, size * 0.45);
                fish.addChild(stripeGfx);

                const tailGfx = new PIXI.Graphics();
                tailGfx.beginFill(color.fin).moveTo(-size * 0.7, 0).lineTo(-size * 1.2, -size * 0.45).lineTo(-size * 1.2, size * 0.45).closePath().endFill();
                fish.addChild(tailGfx);
                fish.tail = tailGfx;

                const dorsalGfx = new PIXI.Graphics();
                dorsalGfx.beginFill(color.fin, 0.7).moveTo(-size * 0.2, -size * 0.45).lineTo(size * 0.1, -size * 0.85).lineTo(size * 0.3, -size * 0.45).closePath().endFill();
                fish.addChild(dorsalGfx);
                fish.dorsal = dorsalGfx;

                const eyeGfx = new PIXI.Graphics();
                eyeGfx.beginFill(0xFFFFFF).drawCircle(size * 0.5, -size * 0.08, size * 0.18).endFill();
                eyeGfx.beginFill(0x111111).drawCircle(size * 0.55, -size * 0.08, size * 0.1).endFill();
                fish.addChild(eyeGfx);

                const mouthGfx = new PIXI.Graphics();
                mouthGfx.lineStyle(1.5, color.accent, 0.8).arc(size * 0.9, size * 0.1, size * 0.12, 0, Math.PI, false);
                fish.addChild(mouthGfx);
                fish.mouth = mouthGfx;

                fish.x = x !== undefined ? x : 50 + Math.random() * (W - 100);
                fish.y = y !== undefined ? y : 50 + Math.random() * (H - 150);
                fish.vx = (Math.random() - 0.5) * 40;
                fish.vy = (Math.random() - 0.5) * 30;
                fish.size = size;
                fish.baseSpeed = 1 + Math.random() * 1.5;
                fish.state = 'wander';
                fish.targetFood = null;
                fish.hungerTimer = 0;
                fish.animOffset = Math.random() * Math.PI * 2;
                fish.direction = fish.vx >= 0 ? 1 : -1;
                fish.name = `Рыбка ${fishes.length + 1}`;
                fish.isLeaving = false;

                fishLayer.addChild(fish);
                fishes.push(fish);
                updateStats();
                checkAchievements();
                return fish;
            }

            function createBubble(x, y) {
                const bubble = new PIXI.Container();
                const gfx = new PIXI.Graphics();
                const sz = 2 + Math.random() * 6;
                gfx.lineStyle(1, 0x7fdbff, 0.4).beginFill(0x7fdbff, 0.08).drawCircle(0, 0, sz).endFill();
                bubble.addChild(gfx);
                bubble.x = x !== undefined ? x : 20 + Math.random() * (W - 40);
                bubble.y = y !== undefined ? y : H + 10;
                bubble.vy = -15 - Math.random() * 25;
                bubble.vx = (Math.random() - 0.5) * 4;
                bubble.size = sz;
                bubble.wobble = Math.random() * Math.PI * 2;
                bubbleLayer.addChild(bubble);
                bubbles.push(bubble);
            }

            // Инициализация
            for (let i = 0; i < 6; i++) createFish();
            loadStats();

            // Автокорм
            let autoFeedInterval = null;
            document.getElementById('autoFeedToggle').addEventListener('change', (e) => {
                if (e.target.checked) {
                    autoFeedInterval = setInterval(() => {
                        const bx = 100 + Math.random() * (W - 200);
                        for (let i = 0; i < 5; i++) createFood(bx + (Math.random() - 0.5) * 80, -10 - Math.random() * 30);
                        showNotification("🤖 Автокорм: брошена порция корма!");
                    }, 15000);
                } else {
                    if (autoFeedInterval) clearInterval(autoFeedInterval);
                }
            });

            // Ночной режим
            let isNightMode = false;
            const nightFilter = new PIXI.filters.ColorMatrixFilter();
            nightFilter.brightness(0.4, false);
            document.getElementById('btnNightMode').addEventListener('click', () => {
                isNightMode = !isNightMode;
                if (isNightMode) {
                    app.stage.filters = [nightFilter];
                    for (const ray of lightRays) {
                        ray.gfx.visible = false;
                    }
                    document.getElementById('btnNightMode').textContent = '☀️ Дневной режим';
                    showNotification("🌙 Ночной режим активирован");
                } else {
                    app.stage.filters = null;
                    for (const ray of lightRays) {
                        ray.gfx.visible = true;
                    }
                    document.getElementById('btnNightMode').textContent = '🌙 Ночной режим';
                    showNotification("☀️ Дневной режим активирован");
                }
            });

            // Обработка кликов
            app.view.addEventListener('click', (e) => {
                if (e.button === 0) {
                    const rect = app.view.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (W / rect.width);
                    const y = (e.clientY - rect.top) * (H / rect.height);
                    scareFish(x, y);
                }
            });

            app.view.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const rect = app.view.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (W / rect.width);
                const y = (e.clientY - rect.top) * (H / rect.height);
                createFood(x, y);
                createFood(x + (Math.random() - 0.5) * 30, y - 10);
                createFood(x + (Math.random() - 0.5) * 30, y - 5);
                showNotification("🍕 Корм брошен!");
                return false;
            });

            document.getElementById('btnFeed').addEventListener('click', () => {
                const bx = 100 + Math.random() * (W - 200);
                for (let i = 0; i < 8; i++) createFood(bx + (Math.random() - 0.5) * 80, -10 - Math.random() * 30);
            });

            document.getElementById('btnAddFish').addEventListener('click', () => {
                if (fishes.length < 25) {
                    createFish();
                } else {
                    showNotification("В аквариуме уже 25 рыбок! Нельзя добавить больше.");
                }
            });

            document.getElementById('btnBubble').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) createBubble(100 + Math.random() * (W - 200), H + Math.random() * 50);
            });

            document.getElementById('btnClear').addEventListener('click', () => {
                while (foods.length) {
                    const f = foods.pop();
                    foodLayer.removeChild(f);
                    f.destroy();
                }
                updateStats();
            });

            // Отслеживаем появление корма для запуска таймера
            const originalCreateFood = createFood;
            window.createFood = function (x, y) {
                const result = originalCreateFood(x, y);
                scheduleScatter();
                return result;
            };
            createFood = function (x, y) {
                const result = originalCreateFood(x, y);
                scheduleScatter();
                return result;
            };

            let time = 0;
            let lastCheck = 0;

            app.ticker.add((delta) => {
                time += delta * 0.016;

                // Проверяем переполнение каждую секунду (но без немедленного разгона)
                if (time - lastCheck > 1) {
                    // Проверяем, есть ли переполненные стаи
                    const processed = new Set();
                    let hasOvercrowded = false;

                    for (const fish of fishes) {
                        if (processed.has(fish)) continue;

                        const cluster = [fish];
                        const queue = [fish];
                        processed.add(fish);

                        while (queue.length > 0) {
                            const current = queue.shift();
                            for (const other of fishes) {
                                if (!processed.has(other)) {
                                    const dist = Math.hypot(other.x - current.x, other.y - current.y);
                                    if (dist < 150) {
                                        cluster.push(other);
                                        processed.add(other);
                                        queue.push(other);
                                    }
                                }
                            }
                        }

                        if (cluster.length > 5) {
                            hasOvercrowded = true;
                            break;
                        }
                    }

                    if (hasOvercrowded && !scatterTimeout && !pendingScatter) {
                        scheduleScatter();
                    }

                    lastCheck = time;
                }

                // Анимация света и растений
                if (!isNightMode) {
                    for (const ray of lightRays) ray.gfx.alpha = 0.3 + 0.3 * Math.sin(time * ray.speed + ray.offset);
                }
                for (const plant of plants) {
                    const sway = Math.sin(time * plant.swaySpeed + plant.swayOffset) * 3;
                    plant.rotation = plant.baseRotation + (sway * Math.PI) / 180;
                }

                // Естественные пузырьки
                if (Math.random() < 0.02) createBubble();

                // Обновление рыбок
                for (const fish of fishes) {
                    fish.hungerTimer += delta * 0.016;

                    let nearestFood = null, nearestDist = Infinity;
                    for (const f of foods) if (!f.eaten) {
                        const dx = f.x - fish.x, dy = f.y - fish.y, dist = Math.hypot(dx, dy);
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            nearestFood = f;
                        }
                    }

                    if (nearestFood && nearestDist < 400) {
                        fish.state = 'chase';
                        fish.targetFood = nearestFood;
                    } else {
                        fish.state = 'wander';
                        fish.targetFood = null;
                    }

                    let targetVx, targetVy;
                    const speed = fish.baseSpeed;

                    if (fish.state === 'chase' && fish.targetFood && !fish.targetFood.eaten) {
                        const fdx = fish.targetFood.x - fish.x, fdy = fish.targetFood.y - fish.y, fdist = Math.hypot(fdx, fdy);
                        if (fdist < fish.size * 0.8) {
                            fish.targetFood.eaten = true;
                            totalEaten++;
                            fish.hungerTimer = 0;
                            updateStats();
                            saveStats();
                            checkAchievements();
                            fish.mouth.visible = false;
                            setTimeout(() => {
                                if (fish.mouth) fish.mouth.visible = true;
                            }, 500);
                            targetVx = fish.vx;
                            targetVy = fish.vy;
                        } else {
                            targetVx = (fdx / fdist) * speed * 3.5;
                            targetVy = (fdy / fdist) * speed * 2.5;
                        }
                    } else {
                        // Притяжение к стае только если рыбка не в режиме "уплывания"
                        if (!fish.isLeaving) {
                            // Считаем соседей
                            let nearbyCount = 0;
                            for (const other of fishes) {
                                if (other !== fish) {
                                    const dist = Math.hypot(other.x - fish.x, other.y - fish.y);
                                    if (dist < 150) {
                                        nearbyCount++;
                                    }
                                }
                            }

                            // Притягиваемся только если вместе с этой рыбкой не больше 5
                            if (nearbyCount + 1 <= 5) {
                                // Находим центр ближайших до 4 соседей
                                const neighbors = [];
                                for (const other of fishes) {
                                    if (other !== fish) {
                                        const dist = Math.hypot(other.x - fish.x, other.y - fish.y);
                                        if (dist < 150) {
                                            neighbors.push({ fish: other, dist: dist });
                                        }
                                    }
                                }
                                neighbors.sort((a, b) => a.dist - b.dist);
                                const attractTo = neighbors.slice(0, Math.min(4, neighbors.length));

                                if (attractTo.length > 0) {
                                    let centerX = fish.x;
                                    let centerY = fish.y;
                                    for (const n of attractTo) {
                                        centerX += n.fish.x;
                                        centerY += n.fish.y;
                                    }
                                    centerX /= (attractTo.length + 1);
                                    centerY /= (attractTo.length + 1);

                                    const dx = centerX - fish.x;
                                    const dy = centerY - fish.y;
                                    const dist = Math.hypot(dx, dy);
                                    if (dist > 30) {
                                        fish.vx += dx * 0.08;
                                        fish.vy += dy * 0.08;
                                    }
                                }
                            }
                        }

                        if (Math.random() < 0.02) {
                            fish.vx += (Math.random() - 0.5) * 3;
                            fish.vy += (Math.random() - 0.5) * 2;
                        }

                        const margin = 60;
                        if (fish.x < margin) fish.vx += 2;
                        if (fish.x > W - margin) fish.vx -= 2;
                        if (fish.y < margin) fish.vy += 2;
                        if (fish.y > H - margin - 40) fish.vy -= 2;

                        let cs = Math.hypot(fish.vx, fish.vy);
                        if (cs > speed) {
                            fish.vx = (fish.vx / cs) * speed;
                            fish.vy = (fish.vy / cs) * speed;
                        }
                        targetVx = fish.vx;
                        targetVy = fish.vy;
                    }

                    fish.x += targetVx * delta;
                    fish.y += targetVy * delta;
                    fish.x = Math.min(Math.max(fish.x, 15), W - 15);
                    fish.y = Math.min(Math.max(fish.y, 30), H - 55);

                    if (targetVx > 0.2) fish.direction = 1;
                    if (targetVx < -0.2) fish.direction = -1;
                    fish.scale.x = fish.direction;

                    const tailWag = Math.sin(time * 6 + fish.animOffset) * 0.3;
                    fish.tail.rotation = tailWag;
                    fish.dorsal.rotation = Math.sin(time * 4 + fish.animOffset) * 0.15;
                }

                // Обновление корма
                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    if (f.eaten) {
                        f.alpha -= 0.1;
                        f.scale.x += 0.1;
                        f.scale.y += 0.1;
                        if (f.alpha <= 0) {
                            foodLayer.removeChild(f);
                            f.destroy();
                            foods.splice(i, 1);
                            updateStats();
                        }
                    } else {
                        f.y += f.sinkSpeed * delta;
                        f.x += f.vx * delta;
                        f.rotation += 0.02 * delta;
                        if (f.y > H - 20) {
                            foodLayer.removeChild(f);
                            f.destroy();
                            foods.splice(i, 1);
                            updateStats();
                        }
                    }
                }

                // Обновление пузырьков
                for (let i = bubbles.length - 1; i >= 0; i--) {
                    const b = bubbles[i];
                    b.y += b.vy * delta;
                    b.x += b.vx * delta + Math.sin(time * 2 + b.wobble) * 0.3;
                    if (b.y < -20 || b.x < -50 || b.x > W + 50) {
                        bubbleLayer.removeChild(b);
                        b.destroy();
                        bubbles.splice(i, 1);
                    }
                }
            });
        })();
    </script>
</body>

</html>
